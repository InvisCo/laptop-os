---
name: Promote main to stable

# Local replacement for projectbluefin/actions reusable-promote-squash.yml.
# The factory reusable requests review from an `<owner>/maintainers` team,
# which does not exist on personal accounts. This thin local version keeps
# the same contract: every push to `main` opens (or refreshes) a squash
# promotion PR from `main` to `stable`; merging it publishes `:stable`.
#
# Differences from upstream:
# - No reviewer request (personal account)
# - No cosign release-gate callout (advisory upstream; signing is still
#   performed keylessly in build-image.yml)
# - Seeds `stable` from `main` on first run (template ships without `stable`)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-main-to-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote main to stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Open or refresh promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # First run: seed `stable` from `main` (identical content, no gate needed)
          if ! git ls-remote --exit-code --heads origin stable >/dev/null 2>&1; then
            echo "No stable branch yet - seeding stable from main."
            git push origin "origin/main:refs/heads/stable"
            exit 0
          fi

          git fetch origin main stable
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse origin/stable)" ]; then
            echo "main and stable are in sync - nothing to promote."
            exit 0
          fi

          TITLE="chore: promote main to stable"
          BODY="Automated promotion of \`main\` to \`stable\`. Merging publishes the \`:stable\` image tag."

          NUMBER="$(gh pr list --repo "$REPO" --base stable --head main --state open --json number --jq '.[0].number // ""')"
          if [ -z "$NUMBER" ]; then
            NUMBER="$(gh pr create --repo "$REPO" --base stable --head main --title "$TITLE" --body "$BODY" | grep -oE '[0-9]+$')"
            echo "Created promotion PR #$NUMBER"
          else
            echo "Promotion PR #$NUMBER already open (auto-refreshes with main)."
          fi

          # Best effort: enable auto-merge if repo settings allow it
          gh pr merge --auto --squash --repo "$REPO" "$NUMBER" || \
            echo "::notice::Auto-merge not enabled yet - merge PR #$NUMBER manually after CI passes."
