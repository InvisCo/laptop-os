---
name: Promote main to stable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  packages: read
  pull-requests: write
  statuses: write

concurrency:
  group: promote-main-to-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote main to stable
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
    with:
      variants: '[{"image":"laptop-os"}]'
      cosign_identity_regexp: '^https://github\.com/InvisCo/laptop-os/\.github/workflows/'
      source_branch: main
      target_branch: stable
    secrets: inherit
