---
name: Sync stable to main

# After each squash-merge promotion (main → stable), the squash commit exists
# only on stable. Since the trees are identical this workflow normally no-ops;
# if a hotfix ever lands on stable directly, it is merged back into main so
# the next promotion PR is not blocked.
#
# Thin caller for the factory reusable in projectbluefin/actions, matching
# bluefin's sync-main-to-testing.yml.

on:
  push:
    branches:
      - stable
  # Safety net, and not just for this workflow: GitHub push events on `stable`
  # blacked out entirely for two weeks here (Aug 30 - Sep 14 2026). Under the
  # candidate-digest release model, a dropped push to `stable` means
  # execute-release.yml never promotes the candidate, so `:stable` silently
  # goes stale. The cron is the only thing that recovers from that. Dispatch it
  # to force a sync after repairing the branch model by hand.
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stable-to-main
  cancel-in-progress: false

jobs:
  sync:
    name: Keep main up-to-date with stable
    uses: projectbluefin/actions/.github/workflows/reusable-sync-branches.yml@0debf71369e3e445c8bafaaf9cfa0cecae40613f # v1
    permissions:
      contents: write
    with:
      source_branch: stable
      target_branch: main
