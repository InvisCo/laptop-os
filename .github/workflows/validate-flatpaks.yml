name: Validate Flatpaks
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "custom/flatpaks/**"
      - "build/validate-flatpaks.sh"
      - ".github/workflows/validate-flatpaks.yml"
jobs:
  validate:
    # Pinned to 24.04: on ubuntu-latest (26.04) the baked apt lists name
    # freshly-rotated package versions that the mirror has already dropped, so
    # the flatpak install 404s. Renovate holds the major below in renovate.json.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The script adds the Flathub remote itself (--user, --if-not-exists), so
      # only the binary is needed here. Refresh the apt lists first: the runner
      # image bakes them at image build time, so once a package rotates off the
      # mirror they name a version that is gone and the install 404s.
      #
      # GitHub's apt mirror also intermittently 404s freshly-published debs
      # (e.g. xdg-desktop-portal); it self-heals within minutes, so retry the
      # install rather than touching sources (mirror+file: URIs need
      # /etc/apt/apt-mirrors.txt).
      - name: Install flatpak
        shell: bash
        run: |
          sudo apt-get update
          installed=0
          for attempt in 1 2 3 4 5; do
            if sudo apt-get install -y flatpak; then
              installed=1
              break
            fi
            echo "apt install attempt $attempt failed; mirror may be mid-sync, retrying in 15s"
            sleep 15
          done
          [ "$installed" -eq 1 ] || { echo "flatpak install kept failing after 5 attempts"; exit 1; }

      # Single implementation of the validation contract, shared with
      # `just validate-flatpaks`. The paths above include the script so a
      # change to the contract runs the check that enforces it.
      - name: Validate Flatpaks
        shell: bash
        run: build/validate-flatpaks.sh
