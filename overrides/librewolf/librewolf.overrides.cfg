// laptop-os LibreWolf overrides (draft - pending user approval)
//
// LibreWolf reads ~/.librewolf/librewolf.overrides.cfg on every profile.
// Activate with: ujust laptop-os-librewolf-overrides
// Every setting here LOOENS a LibreWolf default for convenience; everything
// not listed keeps LibreWolf's hardened default.

// DRM content playback (Netflix, Prime, Spotify web player)
defaultPref("media.eme.enabled", true);

// Google Safe Browsing (malware/phishing protection)
defaultPref("browser.safebrowsing.malware.enabled", true);
defaultPref("browser.safebrowsing.phishing.enabled", true);
defaultPref("browser.safebrowsing.downloads.enabled", true);

// WebGL (Google Earth/Maps, some editors) - was disabled by default
defaultPref("webgl.disabled", false);

// Search suggestions in urlbar
defaultPref("browser.search.suggestEnabled", true);
defaultPref("browser.urlbar.suggest.searches", true);

// Firefox Account / Sync UI (bookmarks+tabs across devices)
defaultPref("identity.fxaccounts.enabled", true);

// --- Candidates requiring explicit approval before enabling: ---

